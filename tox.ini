# content of: tox.ini , put in same dir as setup.py
[tox]
envlist = py39,py312

[testenv]
# install pytest in the virtualenv where commands will be executed
deps =
    pyproj
    netcdf4
    numpy
    scipy
    matplotlib
    pandas
    xarray
    pytest
    flake8
    coverage

setenv =
    OPENBLAS_NUM_THREADS=1
    MKL_NUM_THREADS=1

commands =
    flake8 -j1 --exclude=.ipynb_checkpoints aqmbc
    coverage run -m pytest -v
    coverage report -im
